[project]
name = "domain-setup-mcp"
version = "0.3.0"
description = "MCP server that bulk-configures SPF, DKIM, DMARC and tracking domains for cold email on Cloudflare"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anas Mughal" }]
keywords = ["mcp", "mcp-server", "cold-email", "deliverability", "spf", "dkim", "dmarc", "cloudflare", "dns", "email-authentication", "smartlead", "instantly"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: Name Service (DNS)",
]
dependencies = ["mcp>=2.0", "dnspython>=2.6", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/anasmughal239-alt/domain-setup-mcp"
Issues = "https://github.com/anasmughal239-alt/domain-setup-mcp/issues"

[project.scripts]
domain-setup-mcp = "domain_setup_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_setup_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
